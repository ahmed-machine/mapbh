name: Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USERNAME }}
          key: ${{ secrets.LINODE_SSHKEY }}
          port: ${{ secrets.LINODE_PORT }}
          password: ""
          script: |
            cd ~/mapbh; git stash; git pull; npm install; ./scripts/inject-sw-version.sh; shadow-cljs release release; node scripts/prerender-meta.mjs; ./scripts/server-sync-all.sh;
      - name: Purge cache
        uses: jakejarvis/cloudflare-purge-action@master
        env:
        # Zone is required by both authentication methods
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
