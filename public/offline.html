<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Offline - mapBH</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
            color: black;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .offline-container {
            max-width: 500px;
        }

        .offline-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            background: #2d5016;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 300;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        .retry-btn {
            background: #2d5016;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin-right: 1rem;
            backdrop-filter: blur(10px);
        }

        .retry-btn:hover {
            background: black;
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .cached-links {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .cached-links h3 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .cached-links a {
            color: black;
            text-decoration: none;
            display: block;
            padding: 0.5rem 0;
            transition: opacity 0.3s ease;
        }

        .cached-links a:hover {
            opacity: 1;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            p { font-size: 1.1rem; }
            .retry-btn {
                display: block;
                margin: 0.5rem auto;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">🗺️</div>

        <h1>You're Offline</h1>

        <p>
            It looks like you're not connected to the internet.
            Some parts of mapBH may still be available from your device's cache.
        </p>

        <button class="retry-btn" onclick="window.location.reload()">
            Try Again
        </button>

        <a href="/en/" class="retry-btn">
            Go Home
        </a>

        <div class="cached-links">
            <h3>Available Offline:</h3>
            <a href="/en/">Home</a>
            <a href="/en/catalogue">Catalogue</a>
            <a href="/en/about">About</a>
            <a href="/en/articles/">Articles</a>
        </div>
    </div>

    <script>
        // Check if back online
        window.addEventListener('online', () => {
            document.querySelector('.offline-container').innerHTML = `
                <div class="offline-icon">✅</div>
                <h1>Back Online!</h1>
                <p>Your connection has been restored. Redirecting...</p>
            `;

            setTimeout(() => {
                window.location.href = '/en/';
            }, 2000);
        });
    </script>
</body>
</html>
